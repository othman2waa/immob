name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: immob
          POSTGRES_PASSWORD: ci_ephemeral_password
          POSTGRES_DB: immob_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U immob -d immob_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://immob:ci_ephemeral_password@127.0.0.1:5432/immob_test
      DIRECT_DATABASE_URL: postgresql://immob:ci_ephemeral_password@127.0.0.1:5432/immob_test
      ALLOW_DEMO_SEED: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_USE_SOFTWARE_GL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm db:validate && pnpm db:migrate && pnpm db:seed
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
